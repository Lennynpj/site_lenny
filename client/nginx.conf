server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Cache long pour les assets fingerprintés et les photos
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Médias du film de /portfolio : lourds et figés, gardés une semaine.
    location /film/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location /exercises/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # React Router : toutes les routes renvoient index.html.
    # « no-cache » ne veut pas dire « ne garde rien » mais « revalide avant de
    # réutiliser ». Sans ça, le navigateur garde un ancien index.html selon sa
    # propre heuristique ; cet index pointe vers d'anciens assets, eux-mêmes
    # gardés un an par la règle ci-dessus — et le site reste figé sur l'ancienne
    # version après un déploiement, sans rien afficher d'anormal.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # API → conteneur Node
    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
