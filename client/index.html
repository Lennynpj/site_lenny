<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#09090b" />
    <title>Lenny — Hub</title>

    <!-- Ouverture en plein écran depuis l'écran d'accueil (iOS) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Comptes" />

    <link rel="icon" type="image/png" sizes="192x192" href="/icones/muscu-192.png" />
    <link rel="apple-touch-icon" href="/icones/muscu-apple-180.png" />
    <link rel="manifest" href="/muscu.webmanifest" />

    <script>
      // Avant le premier rendu : thème + identité de l'app (icône, manifeste,
      // titre) selon la partie du site ouverte. Évite le flash de fond sombre
      // et permet d'installer chaque app séparément sur l'écran d'accueil.
      ;(function () {
        var estComptes = location.pathname.indexOf('/comptes') === 0
        var d = document
        var set = function (sel, attr, val) {
          var el = d.querySelector(sel)
          if (el) el.setAttribute(attr, val)
        }
        if (estComptes) {
          d.documentElement.classList.add('theme-clair')
          set('meta[name="theme-color"]', 'content', '#ffffff')
          set('link[rel="manifest"]', 'href', '/comptes.webmanifest')
          set('link[rel="icon"]', 'href', '/icones/comptes-192.png')
          set('link[rel="apple-touch-icon"]', 'href', '/icones/comptes-apple-180.png')
          set('meta[name="apple-mobile-web-app-title"]', 'content', 'Comptes')
          d.title = 'Mes comptes'
        } else if (location.pathname.indexOf('/muscu') === 0) {
          set('meta[name="apple-mobile-web-app-title"]', 'content', 'Muscu')
          d.title = 'Muscu'
        }
        // Marque le mode « installée » : sert à masquer le bandeau d'install.
        if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone)
          d.documentElement.classList.add('installee')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
